version: '3.9'

services:
  aeglos-api:
    build: .
    container_name: aeglos-api
    # Port 8000 is NOT exposed externally — all traffic routes through aeglos-web proxy
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - WORKERS=4
      - DATABASE_URL=postgresql://aeglos:aeglos_pass@postgres:5432/aeglos
      - REDIS_URL=redis://redis:6379
      - AEGLOS_API_KEY=${AEGLOS_API_KEY}
      - CORS_ORIGINS=http://localhost:5000,http://aeglos-web:5000
      - AEGLOS_PERSIST_DIR=/data/state
    volumes:
      - aeglos_state:/data/state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aeglos-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: aeglos-web
    ports:
      - "5000:5000"
    environment:
      - API_BASE_URL=http://aeglos-api:8000
      - AEGLOS_API_KEY=${AEGLOS_API_KEY}
      - WEB_PORT=5000
      - CORS_ORIGINS=http://localhost:5000
    depends_on:
      - aeglos-api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: aeglos-postgres
    environment:
      POSTGRES_DB: aeglos
      POSTGRES_USER: aeglos
      POSTGRES_PASSWORD: aeglos_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeglos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aeglos-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aeglos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/var/www/static:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - aeglos-api
      - aeglos-web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nginx_certs:
  aeglos_state:
